name: Generated ZAPP document
description: 'CRRZG5299I Note that this default file searches all your local
  folders in all open VS Code workspaces, which can be highly inefficient.
  Modify the "locations" entries to be as specific as possible. Add a new entry
  of type "MVS" to specify remote locations. See the documentation for more
  details:
  <https://ibm.github.io/zopeneditor-about/Docs/setting_propertygroup.html>'
author: IBM Z Open Editor
propertyGroups:
  # ── COBOL ───────────────────────────────────────────────────────────
  # syslib : COBOL copybooks for the CICS and IMS paths
  - name: cobol-local
    language: cobol
    libraries:
      - name: syslib
        type: local
        locations:
          - "src/base/cics/copy"
          - "src/base/ims/copy"
  # ── PL/I ────────────────────────────────────────────────────────────
  # syslib : PL/I include files converted from CICS COBOL copybooks
  - name: pl1-local
    language: pl1
    libraries:
      - name: syslib
        type: local
        locations:
          - "**/plinc"
  # ── HLASM ───────────────────────────────────────────────────────────
  # syslib : no macro library exists in the workspace
  - name: asm-local
    language: hlasm
    libraries:
      - name: syslib
        type: local
        locations: [] # TODO: replace [] with path(s) once directory exists, e.g. - "asm/macros"
  # ── JCL ─────────────────────────────────────────────────────────────
  # syslib : batch JCL members
  - name: jcl-local
    language: jcl
    libraries:
      - name: syslib
        type: local
        locations:
          - "src/base/batch/jcl"
  - name: remote-libraries
    language: pl1
    compilerOptions: CICS
    libraries:
        - name: syslib
          type: mvs
          locations:
             - DEV.ZAPPBUIL.BMS.COPY    # default name when running bank-of-z setup
             - CICSTS63.CICS.SDFHCOB
            
profiles:
  # Analysis scope (source directories to scan)
  - name: my-analysis
    type: analysis
    settings:
      containsCics: true
      imsRuntime: IMS_BMP
      analysisScope:
        - name: cobol-scope
          locations:
            - "src/base/cics/cobol"
            - "src/base/ims/cobol"
        - name: pl1-scope
          locations:
            - "src/base/cics/pli"
            - "src/base/ims/pli"
            - "src/base/batch/pli"
        - name: hlasm-scope
          locations:
            - "src/base/ims/DBD"
            - "src/base/ims/PSB"
        - name: jcl-scope
          locations:
            - "src/base/batch/jcl"
      libraries:
        - name: ims-psb
          locations:
            - "src/base/ims/PSB"
        - name: ims-dbd
          locations:
            - "src/base/ims/DBD"

  # TAZ
  - name: taz-test
    type: test
    settings:
      unitTest:
        procLib:
          - SYS1.PROCLIB # Required: Procedure libraries
        userLibraries:
          - BANKZ.V0R1M0.LOAD # Application load libraries
          
  # Custom ZCodeScan rules example
  - name: zcodescan
    type: zcodescan
    settings:
      rules:
        - type: local
          locations:
            - "zcodescan/zcodescan-rules.yaml"

  - name: zBuilder-userbuild
    type: dbb
    settings:
      command: "$DBB_HOME/bin/dbb build"
      lifecycle: user
      lifecycleArgs:
        - "--hlq ${dbbHlq}"
        - "--errPrefix ${errPrefix}" # Requires advanced capabilities
        - "--verbose"
      additionalDependencies:
        - "dbb-app.yaml"
        - "dbb-app_ub.yaml"
      logFilePatterns:
        - "*.log" # Fetch build logs
        - "*.json" # Fetch Runtime.json and BuildReport.json
        - "*.html" # Fetch BuildReport.html